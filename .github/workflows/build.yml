# Build and test on every push. Deployment is a separate, deliberate step:
# see pages.yml.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build is the strictest check here: it fails on a broken internal
      # link, a missing description, or an unknown figure.
      - run: npm run build
